{% extends "base.html" %}
{% block titulo %}Agência{% endblock %}
{% block conteudo %}
<h1>Agência</h1>
<p class="subtitle">Esta agência atende todos os clientes e contas.</p>

<section class="painel" aria-labelledby="agencia-unica">
    <h2 id="agencia-unica">Agência única</h2>
    <div class="tabela-wrap">
        <table>
            <thead>
                <tr><th scope="col">Código</th><th scope="col">Cidade/UF</th></tr>
            </thead>
            <tbody>
                <tr>
                    <td>{{ agencia.codigo }}</td>
                    <td>{{ agencia.cidade }}/{{ agencia.estado }}</td>
                </tr>
            </tbody>
        </table>
    </div>
</section>
{% endblock %}
