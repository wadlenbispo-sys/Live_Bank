<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Banco{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #eef1f4; --surface: #ffffff; --ink: #14213d; --muted: #5b6678;
            --line: #d5dbe3; --accent: #0f766e; --on-accent: #ffffff;
            --positive: #0f766e; --negative: #b3261e;
            --ok-bg: #e3f4f1; --erro-bg: #fbe9e7;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1624; --surface: #172033; --ink: #e8edf5; --muted: #98a3b5;
                --line: #2a3650; --accent: #4fd1c5; --on-accent: #0f1624;
                --positive: #4fd1c5; --negative: #ff8a80;
                --ok-bg: #12332f; --erro-bg: #3b1f1d;
            }
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--ink);
               font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.5; }
        nav { background: var(--surface); border-bottom: 1px solid var(--line); }
        nav .interno { max-width: 960px; margin: 0 auto; padding: 0 1.25rem; display: flex; gap: 0.25rem; flex-wrap: wrap; }
        nav a { padding: 0.9rem 0.75rem; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; }
        nav a:hover { color: var(--ink); }
        nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }
        main { max-width: 960px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
        h1 { font-size: 1.75rem; font-weight: 600; margin: 0 0 0.25rem; }
        h2 { font-size: 1.125rem; font-weight: 600; margin: 0 0 1rem; }
        .subtitle { color: var(--muted); margin: 0 0 1.5rem; }

        .mensagem { padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; border: 1px solid var(--line); }
        .mensagem.ok { background: var(--ok-bg); }
        .mensagem.erro { background: var(--erro-bg); }

        .painel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .totais { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1px;
                  background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-bottom: 1.5rem; }
        .total { background: var(--surface); padding: 1.25rem 1.5rem; }
        .total dt { color: var(--muted); font-size: 0.9rem; }
        .total dd { margin: 0.25rem 0 0; font-size: 2rem; font-weight: 600; }
        .total a { color: inherit; text-decoration: none; }
        .total a:hover { color: var(--accent); }

        form.campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; align-items: end; }
        label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.9rem; color: var(--muted); }
        input, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
                        border-radius: 4px; padding: 0.5rem 0.6rem; width: 100%; }
        button { font: inherit; cursor: pointer; border-radius: 4px; padding: 0.5rem 0.9rem;
                 border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); }
        button.secundario { background: transparent; color: var(--accent); }
        button.perigo { background: transparent; color: var(--negative); border-color: var(--negative); }
        :is(a, button, input, select):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .tabela-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 480px; }
        th, td { padding: 0.75rem 0.5rem; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
        th { font-weight: 500; color: var(--muted); font-size: 0.9rem; }
        th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
        tfoot td { border-bottom: 0; font-weight: 600; }
        .positivo { color: var(--positive); }
        .negativo { color: var(--negative); }
        .vazio { color: var(--muted); margin: 0; }
        .operacoes { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }
        .operacoes input { width: 6.5rem; }
    </style>
</head>
<body>
{% set ep = request.endpoint %}
<nav aria-label="Principal">
    <div class="interno">
        <a href="{{ url_for('index') }}" {% if ep == 'index' %}aria-current="page"{% endif %}>Dashboard</a>
        <a href="{{ url_for('clientes') }}" {% if ep == 'clientes' %}aria-current="page"{% endif %}>Clientes</a>
        <a href="{{ url_for('agencias') }}" {% if ep == 'agencias' %}aria-current="page"{% endif %}>Agências</a>
        <a href="{{ url_for('contas') }}" {% if ep == 'contas' %}aria-current="page"{% endif %}>Contas</a>
        <a href="{{ url_for('relatorio') }}" {% if ep == 'relatorio' %}aria-current="page"{% endif %}>Relatório</a>
    </div>
</nav>
<main>
    {% for categoria, mensagem in get_flashed_messages(with_categories=true) %}
        <div class="mensagem {{ categoria }}" role="status">{{ mensagem }}</div>
    {% endfor %}
    {% block conteudo %}{% endblock %}
</main>
</body>
</html>
