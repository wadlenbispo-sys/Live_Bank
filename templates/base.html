<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Live-Bank{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
{% set ep = request.endpoint %}
<nav aria-label="Principal">
    <div class="interno">
        <a href="{{ url_for('index') }}" {% if ep == 'index' %}aria-current="page"{% endif %}>Painel do Live-Bank</a>
        <a href="{{ url_for('clientes') }}" {% if ep == 'clientes' %}aria-current="page"{% endif %}>Clientes</a>
        <a href="{{ url_for('agencias') }}" {% if ep == 'agencias' %}aria-current="page"{% endif %}>Agências</a>
        <a href="{{ url_for('contas') }}" {% if ep == 'contas' %}aria-current="page"{% endif %}>Contas</a>
        <a href="{{ url_for('relatorio') }}" {% if ep == 'relatorio' %}aria-current="page"{% endif %}>Relatório</a>
    </div>
</nav>
<main>
    {% for categoria, mensagem in get_flashed_messages(with_categories=true) %}
        <div class="mensagem {{ categoria }}" role="status">{{ mensagem }}</div>
    {% endfor %}
    {% block conteudo %}{% endblock %}
</main>
</body>
</html>
